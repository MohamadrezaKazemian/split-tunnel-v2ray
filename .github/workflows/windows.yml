name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:engine
      - run: pnpm test
      - run: pnpm typecheck
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build
      - name: Check installer contains sing-box
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $contents = & 7z l $installer.FullName
          if ($LASTEXITCODE -ne 0 -or -not ($contents | Select-String 'sing-box\.exe')) { throw 'sing-box.exe not found in installer' }
      - uses: actions/upload-artifact@v7
        with:
          name: split-tunnel-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
