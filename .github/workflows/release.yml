name: Draft release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:engine
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Verify Debian sidecar
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb -c "$package" | grep -E 'usr/bin/sing-box$'
      - name: Verify Windows sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $contents = & 7z l $installer.FullName
          if ($LASTEXITCODE -ne 0 -or -not ($contents | Select-String 'sing-box\.exe')) { throw 'sing-box.exe not found in installer' }
      - name: Prepare Linux downloads
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          test "$(node -p "require('./package.json').version")" = "$version"
          mkdir release-output
          mapfile -d '' debs < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print0)
          mapfile -d '' images < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print0)
          test "${#debs[@]}" -eq 1 && test "${#images[@]}" -eq 1
          cp -- "${debs[0]}" "release-output/split-tunnel-v2ray_${version}_linux_amd64.deb"
          cp -- "${images[0]}" "release-output/split-tunnel-v2ray_${version}_linux_amd64.AppImage"
      - name: Prepare Windows downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$') { throw 'Invalid release tag' }
          if ((Get-Content package.json | ConvertFrom-Json).version -ne $version) { throw 'Tag and package version differ' }
          New-Item -ItemType Directory -Path release-output, portable | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          Copy-Item $installers[0].FullName "release-output/split-tunnel-v2ray_${version}_windows_x64-setup.exe"
          Copy-Item src-tauri/target/release/split-tunnel-backend.exe portable/split-tunnel-backend.exe
          Copy-Item src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe portable/sing-box.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md portable/
          Invoke-WebRequest https://raw.githubusercontent.com/SagerNet/sing-box/v1.14.4/LICENSE -OutFile portable/sing-box-LICENSE.txt
          Invoke-WebRequest https://www.gnu.org/licenses/gpl-3.0.txt -OutFile portable/GPL-3.0.txt
          Compress-Archive -Path portable/* -DestinationPath "release-output/split-tunnel-v2ray_${version}_windows_x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: release-output/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Gather assets and checksums
        shell: bash
        run: |
          mkdir release-files
          version=${GITHUB_REF_NAME#v}
          for name in "split-tunnel-v2ray_${version}_linux_amd64.deb" "split-tunnel-v2ray_${version}_linux_amd64.AppImage" "split-tunnel-v2ray_${version}_windows_x64-setup.exe" "split-tunnel-v2ray_${version}_windows_x64-portable.zip"; do
            test -f "release-assets/$name"
            cp -- "release-assets/$name" "release-files/$name"
          done
          cp LICENSE THIRD_PARTY_NOTICES.md release-files/
          curl --fail --location --retry 3 https://raw.githubusercontent.com/SagerNet/sing-box/v1.14.4/LICENSE -o release-files/sing-box-LICENSE.txt
          curl --fail --location --retry 3 https://www.gnu.org/licenses/gpl-3.0.txt -o release-files/GPL-3.0.txt
          cd release-files
          sha256sum * > SHA256SUMS.txt
      - name: Create prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          sed -e "s/v0\.1\.0/v${version}/g" -e "s/_0\.1\.0_/_${version}_/g" .github/RELEASE_NOTES.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" release-files/* --draft --prerelease --title "$GITHUB_REF_NAME (experimental)" --notes-file release-notes.md
