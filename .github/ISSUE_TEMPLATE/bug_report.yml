name: Bug report
description: Report a reproducible problem
title: "bug: "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened and how can we reproduce it?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, subscription links, IP addresses and personal paths.
      render: text
